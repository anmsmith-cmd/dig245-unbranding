<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nike Unbranding</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
        }

        header {
            height: 115px;
            position: relative;
            text-align: center;
            background-color: white;
        }

        .swoosh {
            position: absolute;
            top: 12px;
            left: 10px;
            width: 65px;
        }

        .navigation {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            white-space: nowrap;
        }

        h1 {
            position: absolute;
            top: 43px;
            left: 0;
            width: 100%;
            margin: 0;
            font-family: Impact, "Arial Black", sans-serif;
            font-size: 56px;
            line-height: 1;
            letter-spacing: -1px;
            cursor: pointer;
        }

        .top-message {
            display: none;
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            font-size: 10px;
        }

        .subheading {
            display: none;
            position: absolute;
            top: 96px;
            left: 0;
            width: 100%;
            font-size: 11px;
        }

        .main-image {
            display: block;
            width: 100%;
            height: calc(100vh - 115px);
            min-height: 400px;
            object-fit: cover;
            object-position: center;
            background-color: black;
            transition: opacity 0.2s ease;
        }

        body.unbranded .navigation {
            display: none;
        }

        body.unbranded .swoosh {
    display: none;
        }

        body.unbranded .top-message,
        body.unbranded .subheading {
            display: block;
        }

        body.unbranded h1 {
            top: 43px;
        }
    </style>
</head>

<body>
    <header>
        <img
            class="swoosh"
            src="https://upload.wikimedia.org/wikipedia/commons/a/a6/Logo_NIKE.svg"
            alt="Nike swoosh"
        >

        <div class="navigation">
            Men　 Women　 Kids　 Jordan　 NikeSKIMS　 Sportswear　 Sale
        </div>

        <div class="top-message">
            Behind Every Product Is A Person
        </div>

        <h1 id="headline">JUST DO IT.</h1>

        <div class="subheading">
            but who does the work?
        </div>
    </header>

    <img
        class="main-image"
        id="main-image"
        src="img/nike-shoe.jpg"
        alt="Nike shoe"
    >

    <script>
        const headline = document.getElementById("headline");
        const image = document.getElementById("main-image");

        const shoeImage = "img/nike-shoe.jpg";
        const workerImage = "img/factory-workers.jpg";

        // factory image before the hover effect
        const preload = new Image();
        preload.src = workerImage;

        // show the unbranding design
        headline.addEventListener("mouseenter", function () {
            document.body.classList.add("unbranded");

            image.style.opacity = "0";

            setTimeout(function () {
                image.src = workerImage;
                image.alt = "Factory workers making shoes";
                image.style.opacity = "1";
            }, 200);
        });

        // return to the original design
        headline.addEventListener("mouseleave", function () {
            document.body.classList.remove("unbranded");

            image.style.opacity = "0";

            setTimeout(function () {
                image.src = shoeImage;
                image.alt = "Nike shoe";
                image.style.opacity = "1";
            }, 200);
        });
    </script>
</body>
</html>
